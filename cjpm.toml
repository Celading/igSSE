[package]
  cjc-version = "1.1.3"
  name = "igsse"
  version = "0.1.0"
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  license = "Apache-2.0"
  description = "Server-Sent Events (WHATWG) codec, resume, heartbeat and backpressure for Cangjie — pure std"
  include = ["src", "README.md", "LICENSE", "NOTICE"]
  exclude = ["target", "build", "_helper", "scripts", "cangjie-repo.toml", "**/cangjie-repo.toml", "**/cangjie-repo.toml.*", "**/__pycache__/**", "**/*.pyc", "**/*.bak"]
